<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataCrew- OperateWithAI Console</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2313804b'/><path d='M6 17 h6 l3 -7 l4 13 l3 -6 h4' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/static/styles.css?v=1.0.0">
  <link rel="stylesheet" href="/static/operate.css?v=1.0.0">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" style="background:var(--ok)">O</div>
        <div><div class="brand-name" id="brandName">DataCrew- OperateWithAI</div><div class="brand-sub" id="brandSub">Agentic Data Operations</div></div>
      </div>
      <nav id="nav">
        <div class="nav-group">Operations</div>
        <a href="#/fleet" data-route="fleet">Fleet health</a>
        <a href="#/cases" data-route="cases">Case queue</a>
        <a href="#/approvals" data-route="approvals">Approvals <span id="apprCount"></span></a>
        <div class="nav-group">Product</div>
        <div style="padding:2px 6px 6px"><select id="productPick" aria-label="Product"></select></div>
        <a href="#/service" data-route="service">Service page</a>
        <a href="#/finops" data-route="finops">FinOps</a>
        <a href="#/governance" data-route="governance">Governance</a>
        <a href="#/learning" data-route="learning">Learning</a>
        <div class="nav-group">Setup</div>
        <a href="#/onboard" data-route="onboard">Onboard a product</a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn ghost small" id="themeToggle" title="Toggle theme">Theme</button>
        <span id="version" class="muted small"></span>
      </div>
    </aside>
    <main id="main"><div class="loading">Loading…</div></main>
  </div>
  <div id="toast"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"><div id="modalBody"></div></div></div>
  <script src="/static/app.js?v=1.0.0"></script>
</body>
</html>
