# Synthetic Telco pack for the Demo Simulator. No vendor names; no real data.
domain_pack:
  id: telco
  severity_overrides:
    - match: {object_tag: billing}
      min_severity: S2
      reason: Billing dataset
handover_pack:
  dp_id: telco_usage_daily
  name: Daily usage and billing summary
  domain_pack: telco
  regulated: false
  owners:
    product_owner: Kai Product
    service_owner: Lee Service
    platform_owner: Pat Platform
    data_steward: Mo Steward
    data_owner: Nia Owner
    security_compliance: Sec Compliance
    release_manager: Rae Release
    tech_lead: Tia Lead
  on_call: Oncall Telco
  objectives:
    - {id: OBJ-1, kind: freshness, object: mart.usage_daily, target: 180, unit: minutes}
    - {id: OBJ-2, kind: completeness, object: raw.usage_records, target: 25, unit: pct_band}
  pipelines:
    - id: usage_ingest
      owner: Oncall Telco
      idempotent: false
      rollback_ref: runbook#usage-rollback
      objects: [raw.usage_records, curated.usage_by_region, mart.usage_daily]
      schedule: "daily 02:00"
    - id: billing_ingest
      owner: Oncall Telco
      idempotent: true
      rollback_ref: runbook#billing-rollback
      objects: [raw.billing_accounts, mart.billing_summary]
      schedule: "daily 03:00"
  quality_rules:
    - {id: DQ-T1, object: mart.billing_summary, blocking: true, description: Every account has a plan}
  consumers: [billing-ops, finance-reporting]
  lineage:
    - [raw.usage_records, curated.usage_by_region]
    - [curated.usage_by_region, mart.usage_daily]
    - [raw.billing_accounts, mart.billing_summary]
    - [mart.usage_daily, mart.billing_summary]
  cost_estimate_daily: 60.0
  access_model: ["role:telco_reader SELECT mart.usage_daily", "role:telco_etl ALL raw.*"]
  object_tags:
    raw.billing_accounts: [billing]
    mart.billing_summary: [billing]
  schema_contract:
    raw.billing_accounts: {account_id: string, plan_code: string, msisdn_hash: string}
