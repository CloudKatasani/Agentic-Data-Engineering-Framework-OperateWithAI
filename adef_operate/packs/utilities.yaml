# Synthetic Utilities pack for the Demo Simulator. No vendor names; no real data.
domain_pack:
  id: utilities
  build_pack: {pack_id: utilities, pack_version: "0.1.0", source: "Build-With-AI skills/adef-stack-binding/assets/domain-pack.utilities.yaml"}
  controls:
    - {id: UTL-C1, text: "OT and IT data stay segregated; no agent tool has a path into operational networks.", checked_by: []}
    - {id: UTL-C2, text: "Critical-infrastructure protected information is Restricted; metadata-only for agents; access changes need Security and Compliance.", checked_by: [grants, masking]}
    - {id: UTL-C3, text: "Regulatory reporting datasets need full lineage and reproducible point-in-time results.", checked_by: []}
    - {id: UTL-C4, text: "Customer usage data is shared outside the owning domain only aggregated or masked.", checked_by: [masking, grants]}
  severity_overrides:
    # A Domain Pack may raise a severity, never lower it.
    - match: {object_tag: regulated}
      min_severity: S2
      reason: Regulated operational dataset (settlement reads)
handover_pack:
  client_id: client-u
  dp_id: util_meter_daily
  name: Daily meter consumption
  domain_pack: utilities
  regulated: true
  owners:
    product_owner: Avery Product
    service_owner: Sam Service
    platform_owner: Pat Platform
    data_steward: Dana Steward
    data_owner: Olu Owner
    security_compliance: Sec Compliance
    release_manager: Rae Release
    tech_lead: Tia Lead
  on_call: Oncall Utilities
  objectives:
    - {id: OBJ-1, kind: freshness, object: gold.daily_consumption, target: 120, unit: minutes, description: Loaded by 06:00 (lag under 2h)}
    - {id: OBJ-2, kind: completeness, object: bronze.meter_interval_reads, target: 25, unit: pct_band, description: Row count within 25% of weekday band}
    - {id: OBJ-3, kind: completeness, object: bronze.outage_events, target: 25, unit: pct_band}
  pipelines:
    - id: meter_ingest
      owner: Oncall Utilities
      idempotent: true
      rollback_ref: runbook#meter-ingest-rollback
      objects: [bronze.meter_interval_reads, silver.meter_interval, gold.daily_consumption]
      schedule: "daily 04:00"
    - id: outage_ingest
      owner: Oncall Utilities
      idempotent: true
      rollback_ref: runbook#outage-rollback
      objects: [bronze.outage_events, silver.outages]
      schedule: "hourly"
      quarantine_path: quarantine.outage_events
  quality_rules:
    - {id: DQ-U1, object: silver.meter_interval, blocking: true, description: No negative interval reads}
  consumers: [settlement-reporting, network-planning]
  lineage:
    - [bronze.meter_interval_reads, silver.meter_interval]
    - [silver.meter_interval, gold.daily_consumption]
    - [bronze.outage_events, silver.outages]
  cost_estimate_daily: 40.0
  access_model: ["role:util_reader SELECT gold.daily_consumption", "role:util_etl ALL bronze.*"]
  object_tags:
    bronze.meter_interval_reads: [regulated]
    silver.meter_interval: [regulated]
    gold.daily_consumption: [regulated]
  restricted_columns:
    bronze.meter_interval_reads: [meter_id]
  masking_policies:
    bronze.meter_interval_reads.meter_id: mask-hash-v1
  retention_days:
    bronze.meter_interval_reads: 400
    bronze.outage_events: 400
  privileged_roles: [role:util_etl]
  schema_contract:
    bronze.meter_interval_reads: {meter_id: string, interval_start: timestamp, kwh: decimal}
