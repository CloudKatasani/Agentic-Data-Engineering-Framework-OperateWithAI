# Vendored from Build-With-AI adef/catalog/stacks.py (preset azure-fabric, profile_version 2.0.0).
# Operate reads the same Stack Profile; only telemetry adapters differ. No secrets in this file.
profile_id: azure-fabric
label: "DB2 \u2192 OneLake Delta \u2192 Microsoft Fabric"
description: IBM Db2 to OneLake with Data Factory, Delta tables curated with Fabric
  Spark, served from the Fabric Warehouse with Purview governance.
profile_version: 2.0.0
portability_required: false
executable_locally: false
variables:
  org_prefix: acme
  domain: customer
  lake_root: abfss://lake@acmelake.dfs.core.windows.net
environments:
  dev:
    purpose: sandbox
    agent_max_class: A1
    secrets_ref: kv/adef/dev
  test:
    purpose: shared
    agent_max_class: A2
    secrets_ref: kv/adef/test
  prod:
    purpose: production
    agent_max_class: A0
    secrets_ref: kv/adef/prod
slots:
  lineage:
    tool: openlineage
    version: current
  virtualization:
    tool: none
    reason: not required for v1
  ai_consumption:
    tool: none
    reason: not required for v1
  itsm:
    tool: servicenow
    version: current
  approval_channel:
    tool: adef-console
    version: current
  source_database:
    tool: db2
    version: current
  cloud:
    tool: azure
    version: current
  object_storage:
    tool: onelake
    version: current
  table_format:
    tool: delta
    version: current
  lake_catalog:
    tool: onelake
    version: current
  ingestion:
    tool: azure-data-factory
    version: current
  lakehouse_compute:
    tool: fabric-spark
    version: current
  transformation:
    tool: spark-sql
    version: current
  compute_engine:
    tool: fabric
    version: current
  orchestration:
    tool: azure-data-factory
    version: current
  data_quality:
    tool: great-expectations
    version: current
  catalog_governance:
    tool: purview
    version: current
  semantic_layer:
    tool: platform-native
    version: current
  bi:
    tool: power-bi
    version: current
  version_control:
    tool: azure-repos
    version: current
  cicd:
    tool: azure-pipelines
    version: current
  iac:
    tool: bicep
    version: current
  secrets:
    tool: azure-key-vault
    version: current
  observability:
    tool: platform-native
    version: current
limits:
  max_compute_size: S
  auto_suspend_seconds: 60
  query_timeout_seconds: 120
  profiling_row_cap: 10000
  monthly_cost_cap: 500
standards:
  layers:
  - bronze
  - silver
  - gold
  - serving
  naming_case: lower_snake
  history_default: type-2
  timezone: UTC
  branch_strategy: trunk-with-feature-branches
  protected_branches:
  - main
