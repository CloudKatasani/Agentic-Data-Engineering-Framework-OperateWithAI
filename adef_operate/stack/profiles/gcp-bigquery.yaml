# Vendored from Build-With-AI adef/catalog/stacks.py (preset gcp-bigquery, profile_version 2.0.0).
# Operate reads the same Stack Profile; only telemetry adapters differ. No secrets in this file.
profile_id: gcp-bigquery
label: "Oracle \u2192 GCS Iceberg \u2192 BigQuery"
description: Oracle to GCS with Datastream, Iceberg tables in the BigLake metastore
  curated on Dataproc, served from BigQuery as BigLake Iceberg tables.
profile_version: 2.0.0
portability_required: false
executable_locally: false
variables:
  org_prefix: acme
  domain: customer
  lake_root: gs://acme-lake
environments:
  dev:
    purpose: sandbox
    agent_max_class: A1
    secrets_ref: projects/adef/secrets/dev
  test:
    purpose: shared
    agent_max_class: A2
    secrets_ref: projects/adef/secrets/test
  prod:
    purpose: production
    agent_max_class: A0
    secrets_ref: projects/adef/secrets/prod
slots:
  lineage:
    tool: openlineage
    version: current
  virtualization:
    tool: none
    reason: not required for v1
  ai_consumption:
    tool: none
    reason: not required for v1
  itsm:
    tool: jira
    version: current
  approval_channel:
    tool: adef-console
    version: current
  source_database:
    tool: oracle
    version: current
  cloud:
    tool: gcp
    version: current
  object_storage:
    tool: gcs
    version: current
  table_format:
    tool: iceberg
    version: current
  lake_catalog:
    tool: biglake-metastore
    version: current
  ingestion:
    tool: gcp-datastream
    version: current
  lakehouse_compute:
    tool: dataproc
    version: current
  transformation:
    tool: spark-sql
    version: current
  compute_engine:
    tool: bigquery
    version: current
  orchestration:
    tool: airflow
    version: current
  data_quality:
    tool: great-expectations
    version: current
  catalog_governance:
    tool: dataplex
    version: current
  semantic_layer:
    tool: platform-native
    version: current
  bi:
    tool: looker
    version: current
  version_control:
    tool: github
    version: current
  cicd:
    tool: github-actions
    version: current
  iac:
    tool: terraform
    version: current
  secrets:
    tool: gcp-secret-manager
    version: current
  observability:
    tool: platform-native
    version: current
limits:
  max_compute_size: S
  auto_suspend_seconds: 60
  query_timeout_seconds: 120
  profiling_row_cap: 10000
  monthly_cost_cap: 500
standards:
  layers:
  - bronze
  - silver
  - gold
  - serving
  naming_case: lower_snake
  history_default: type-2
  timezone: UTC
  branch_strategy: trunk-with-feature-branches
  protected_branches:
  - main
