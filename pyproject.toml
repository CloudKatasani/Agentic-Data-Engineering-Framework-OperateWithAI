[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operatewithai"
version = "3.0.0"
description = "OpsCrew-OperateWithAI: AI agents and people running a data platform managed service (ADEF suite)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=2.8"]

[tool.setuptools.packages.find]
include = ["operatewithai*"]

[tool.setuptools.package-data]
operatewithai = ["clients/*.yaml", "clients/*/*.yaml", "knowledge/*.yaml", "web/*.html", "web/*.js", "web/*.css", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
