name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m adef_operate.skills_check skills
      - run: pytest -q
      - run: python -m adef_operate guardrails --profile example-a
      - run: python -m adef_operate evals --profiles all --out evals-report
      - run: python -m adef_operate shadow-rehearsal --profile example-b
